
spring:
  application:
    name: auction-system

  # Ket noi MySQL
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/auction_db?createDatabaseIfNotExist=true}"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:root}"

  # Cau hinh JPA
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# Cau hinh JWT
app:
  jwt:
    secret: "${JWT_SECRET:change-me-change-me-change-me-change-me}"
    expiration-seconds: 3600
