spring.application.name=auction-system

# Kết nối MySQL (có thể ghi đè bằng biến môi trường, docker-compose đã làm sẵn)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auction_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (secret HS256 cần tối thiểu 32 ký tự; đổi khi triển khai thật)
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.jwt.expiration-seconds=3600
